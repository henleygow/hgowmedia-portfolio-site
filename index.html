<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Title, description and share text live here; everything else is in data/projects.js -->
    <title>Henley Gow: video editor for brands, sports and social</title>
    <meta
      name="description"
      content="Henley Gow edits short-form ads, sports edits, real estate and brand films. Based in Connecticut, available remote worldwide."
    />
    <meta property="og:title" content="Henley Gow: video editor for brands, sports and social" />
    <meta
      property="og:description"
      content="Short-form ads, sports edits, real estate and brand films, with color and sound finished in the same pass."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Once the site has a domain: add og:image (a full https URL to a 1200x630 still) and link rel="canonical" -->
    <meta name="theme-color" content="#0e0e0d" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..600&family=Rethink+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="wrap">
        <a class="skip" href="#top">Skip to content</a>
        <a class="brand" href="#top" translate="no">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="4.5" />
            <circle cx="17.5" cy="6.5" r="4.5" />
            <circle cx="6.5" cy="17.5" r="4.5" />
            <rect class="mark__accent" x="13" y="13" width="9" height="9" rx="1.5" />
          </svg>
          <span data-name></span>
        </a>
        <nav class="nav__links" aria-label="Primary">
          <a href="#work">Work</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
        <a class="btn btn--primary" data-email-link href="#contact">Email me</a>
      </div>
    </header>

    <main id="top">
      <!-- HERO: the name over a moving ground (the light-leak effect, or the reel when profile.heroVideo is set) -->
      <section class="hero" id="hero">
        <div class="wrap hero__inner">
          <dl class="hero__facts" id="heroFacts"></dl>
          <h1 class="hero__name" translate="no" data-name></h1>
          <div class="hero__controls" id="heroControls">
            <button class="hero__ctl" id="heroPause" type="button" hidden>Pause motion</button>
          </div>
        </div>
      </section>

      <section class="section" id="work">
        <div class="wrap">
          <h2 data-reveal>Selected work</h2>
          <ul class="work-list" id="workList"></ul>
        </div>
      </section>

      <section class="section" id="about">
        <div class="wrap about">
          <div class="about__text" data-reveal>
            <h2>About <span data-first-name></span></h2>
            <p class="statement" id="aboutStatement"></p>
            <p class="about__blurb" id="aboutBlurb"></p>
          </div>
          <div class="about__lists" data-reveal style="--d: 120ms">
            <div>
              <h3>What I cut</h3>
              <ul class="plain-list" id="servicesList"></ul>
            </div>
            <div>
              <h3>Toolkit</h3>
              <ul class="plain-list" id="toolkitList"></ul>
            </div>
          </div>
          <!-- Portrait slot: set profile.portrait in data/projects.js -->
          <img class="about__photo" id="portrait" alt="" width="1000" height="1250" loading="lazy" hidden />
        </div>
      </section>
    </main>

    <footer class="closing" id="contact">
      <div class="wrap">
        <div class="close">
          <div class="close__lead" data-reveal>
            <h2>Contact</h2>
            <p class="close__line">Email me about a project. Discord and Instagram work too.</p>
            <a class="btn btn--primary btn--xl" data-email-link href="#contact">Email me</a>
          </div>
          <ul class="channels" id="channels" data-reveal style="--d: 120ms"></ul>
        </div>
        <p class="legal"><span id="legal"></span> · Product names and logos are trademarks of their owners.</p>
        <p class="wordmark" aria-hidden="true" translate="no" data-name></p>
      </div>
    </footer>

    <!-- A few silent seconds of the hovered project, beside the pointer (desktop only) -->
    <div class="peek" id="peek" aria-hidden="true">
      <video muted loop playsinline preload="none" tabindex="-1"></video>
    </div>

    <!-- The video view: fills the screen, the video at its own shape over a blurred still -->
    <dialog class="viewer" id="player" aria-labelledby="playerTitle">
      <img class="viewer__backdrop" id="playerBackdrop" alt="" />
      <form class="viewer__bar" method="dialog">
        <p class="viewer__title" id="playerTitle"></p>
        <button class="link" type="submit">Close</button>
      </form>
      <div class="viewer__stage" id="playerFrame"></div>
      <p class="viewer__blurb" id="playerBlurb"></p>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
